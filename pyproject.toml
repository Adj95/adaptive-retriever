[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-retriever"
version = "1.0.0"
description = "A cost-aware, self-evaluating adaptive retrieval system"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "typer>=0.12.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "pyyaml>=6.0",
    "structlog>=24.1.0",
    "diskcache>=5.6.0",
    "tenacity>=8.3.0",
    "pymupdf>=1.24.0",
    "pymupdf4llm>=0.0.17",
    "docling>=2.0.0",
    "trafilatura>=1.10.0",
    "tree-sitter>=0.22.0",
    "langchain-text-splitters>=0.2.0",
    "sentence-transformers>=3.0.0",
    "fastembed>=0.3.0",
    "qdrant-client>=1.9.0",
    "torch>=2.2.0",
    "numpy==2.2.6",
    "scipy>=1.13.0",
    "pandas>=2.2.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
cli = "adaptive_retriever.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
